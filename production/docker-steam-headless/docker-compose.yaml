name: steam-headless

volumes:
  steam-headless-data:
    name: steam-headless-data

services:
  steam-headless:
    image: josh5/steam-headless:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true
    cgroup: private
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true
    network_mode: host
    hostname: steam-headless

    # DEVICES:
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

    # Ensure container access to devices 13:*
    device_cgroup_rules:
      - "c 13:* rmw"

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    # VOLUMES:
    volumes:
      - /etc/localtime:/run/host-localtime:ro
      # The location of your home directory.
      - steam-headless-data:/home/default/:rw
      - /mnt/data/docker/steam-headless/games/:/mnt/games/:rw

      # The Xorg socket.
      - steam-headless-data:/tmp/.X11-unix/:rw

      # Pulse audio socket.
      - steam-headless-data:/tmp/pulse/:rw
