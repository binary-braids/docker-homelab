name: xen-orchestra

networks:
  proxy:
    external: true

volumes:
  xen-orchestra-data:
    name: xen-orchestra-db-data
  xen-orchestra-redis-data:
    name: xen-orchestra-redis-data
  xen-orchestra-vddk-lib:
    name: xen-orchestra-vddk-lib

services:
  xen-orchestra:
    image: ronivay/xen-orchestra:5.211.1
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - HTTP_PORT=80
    volumes:
      - xen-orchestra-data:/var/lib/xo-server
      - xen-orchestra-redis-data:/var/lib/redis
      - xen-orchestra-vddk-lib:/usr/local/lib/vddk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.xen-orchestra.rule=Host(`xen-orchestra.binarybraids.com`)"
      - "traefik.http.routers.xen-orchestra.entrypoints=https"
      - "traefik.http.routers.xen-orchestra.tls=true"
      - "traefik.http.routers.xen-orchestra.service=xen-orchestra"
      - "traefik.http.services.xen-orchestra.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"